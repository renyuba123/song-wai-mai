name: Repository integrity

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository with LFS objects
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Verify Git LFS pointers
        run: git lfs fsck --pointers

      - name: Warn about overlapping Godot scene changes
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            try {
              const owner = context.repo.owner;
              const repo = context.repo.repo;
              const currentNumber = context.payload.pull_request.number;
              const baseBranch = context.payload.pull_request.base.ref;

              const currentFiles = await github.paginate(
                github.rest.pulls.listFiles,
                { owner, repo, pull_number: currentNumber, per_page: 100 }
              );
              const currentScenes = new Set(
                currentFiles
                  .map(file => file.filename)
                  .filter(name => name.toLowerCase().endsWith('.tscn'))
              );

              if (currentScenes.size === 0) {
                core.info('This pull request does not change a .tscn file.');
                return;
              }

              const openPulls = await github.paginate(
                github.rest.pulls.list,
                { owner, repo, state: 'open', base: baseBranch, per_page: 100 }
              );

              for (const pull of openPulls) {
                if (pull.number === currentNumber) continue;

                const otherFiles = await github.paginate(
                  github.rest.pulls.listFiles,
                  { owner, repo, pull_number: pull.number, per_page: 100 }
                );
                const otherScenes = new Set(
                  otherFiles
                    .map(file => file.filename)
                    .filter(name => name.toLowerCase().endsWith('.tscn'))
                );
                const overlap = [...currentScenes].filter(name => otherScenes.has(name));

                for (const filename of overlap) {
                  core.warning(
                    `${filename} is also modified by open PR #${pull.number} (${pull.title}). Review the scene changes together to avoid a merge conflict.`,
                    { file: filename, title: 'Overlapping Godot scene changes' }
                  );
                }
              }
            } catch (error) {
              core.warning(`Could not inspect other open PRs for overlapping .tscn files: ${error.message}`);
            }

      - name: Install Godot 4.7.2
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/godot.zip \
            https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.2-stable_linux.x86_64
          /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --version | grep -q '^4.7.2.stable'

      - name: Run Godot headless tests
        run: |
          set -euo pipefail
          GODOT=/tmp/godot/Godot_v4.7.2-stable_linux.x86_64
          "$GODOT" --headless --path . --import
          for test in test_road_network test_main_scene test_contracts test_input_actions test_navigation_queries test_city test_city_catalog test_god_view test_orders test_menu_ui test_phone_orders test_traffic test_city_population test_city_streaming test_traffic_streaming test_pause test_route_guidance test_pedestrians test_site_readability test_touch_controls; do
            "$GODOT" --headless --path . --script "res://tests/${test}.gd"
          done
